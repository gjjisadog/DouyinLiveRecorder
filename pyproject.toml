[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-live-recorder"
version = "4.0.7"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.31,<3",
    "loguru>=0.7.3,<0.8",
    "pycryptodome>=3.20,<4",
    "distro>=1.9,<2",
    "tqdm>=4.67,<5",
    "httpx[http2]>=0.28.1,<0.29",
    "PyExecJS>=1.5.1,<2",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
test = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests", "client/tests"]
addopts = "-ra"
markers = ["integration: local process and media integration tests"]
