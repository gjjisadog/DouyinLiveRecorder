name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_target:
        description: Docker target to publish
        required: true
        default: nas-web
        type: choice
        options:
          - nas-web
          - both
      image_tag:
        description: Base image tag (the nas-web suffix is added automatically)
        required: true
        default: 4.0.7
        type: string

env:
  IMAGE_NAME: ghcr.io/gjjisadog/douyin-live-recorder

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.lock pytest==8.3.5
      - name: Validate UTF-8 text files
        run: python scripts/check_text_encoding.py
      - name: Run all tests
        run: python -m pytest -v
      - name: Validate Python sources
        run: python -m compileall -q app client tests scripts main.py
      - name: Validate all Compose modes
        run: |
          docker compose -f docker-compose.yaml config
          docker compose -f docker-compose.flyinnas.yaml config
          docker compose -f docker-compose.flyinnas.import.yaml config
      - name: Build daemon target
        run: docker build --target daemon -t dlr-daemon:ci .
      - name: Build NAS web target
        run: docker build --target nas-web -t dlr-nas-web:ci .
      - name: Run Docker health, web and graceful-stop smoke tests
        run: python scripts/docker_runtime_smoke.py --daemon-image dlr-daemon:ci --nas-image dlr-nas-web:ci

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.publish_target == 'nas-web' && '[{"target":"nas-web","suffix":"-nas-web"}]' || '[{"target":"daemon","suffix":""},{"target":"nas-web","suffix":"-nas-web"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=raw,value=latest${{ matrix.suffix }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.image_tag }}${{ matrix.suffix }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AMD64/ARM64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
      - name: Scan published image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.target }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.target }}.sarif
          category: docker-${{ matrix.target }}

  armv7-experimental:
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build experimental ARMv7 image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: daemon
          push: false
          platforms: linux/arm/v7
          cache-from: type=gha,scope=armv7
          cache-to: type=gha,mode=max,scope=armv7
