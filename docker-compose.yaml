services:
  app:
    image: ${DLR_IMAGE_REPOSITORY:-douyin-live-recorder}:${DLR_IMAGE_TAG:-4.0.7}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: douyin-live-recorder
    environment:
      - TZ=Asia/Shanghai
      - TERM=xterm-256color
      - DLR_HEADLESS=1
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./backup_config:/app/backup_config
      - ./downloads:/app/downloads
    healthcheck:
      test: ["CMD", "python", "-m", "client.infra.docker.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    stop_grace_period: 30s
